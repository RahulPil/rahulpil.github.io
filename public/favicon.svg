<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #FAF7F2; }
    .fg { fill: #111111; }
    .accent { fill: #B23A2A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E0D0B; }
      .fg { fill: #FAF7F2; }
      .accent { fill: #D97757; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <text class="fg" x="15" y="23" font-family="Georgia, serif" font-size="22" font-weight="500" text-anchor="middle">R</text>
  <circle class="accent" cx="23" cy="23" r="1.6"/>
</svg>
